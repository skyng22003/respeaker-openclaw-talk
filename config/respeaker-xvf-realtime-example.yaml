# =============================================================================
# reSpeaker XVF3800 OpenClaw realtime uplink — software prototype.
#
# This configuration is additive: the priority wake branches (mute, ringing
# timer, announcement, wake sound, beam lock) still come from the shared
# voice-assistant package. Only the final ordinary-wake action is rerouted, by
# overriding ${wake_session_script_id} to start a realtime session. Building
# this file does not authorize uploading it to hardware.
# =============================================================================

substitutions:
  name: respeaker-xvf3800-realtime
  friendly_name: reSpeaker XVF3800 Realtime Prototype
  respeaker_ref: main
  realtime_ref: feature/realtime-talk-bridge
  # Override the shared package default (start_voice_session) so an ordinary
  # wake word starts the realtime session. Main-config substitutions take
  # precedence over package substitutions.
  wake_session_script_id: start_realtime_session

packages:
  respeaker:
    # The realtime branch carries the shared wake-routing hook as well as the
    # realtime package. Keep every package on the same ref so the hook cannot
    # be silently replaced by the upstream voice-assistant package.
    url: https://github.com/skyng22003/respeaker-openclaw-talk
    ref: ${realtime_ref}
    refresh: 0s
    files:
      - packages/base.yaml
      - packages/hardware.yaml
      - packages/voice-assistant.yaml
      - packages/leds.yaml
      - packages/timers-alarm.yaml
  realtime:
    url: https://github.com/skyng22003/respeaker-openclaw-talk
    ref: ${realtime_ref}
    refresh: 0s
    files:
      - packages/realtime-talk.yaml

# The package set and realtime component use one project ref so their IDs and
# wake-routing contract are compiled together.
external_components:
  - source:
      type: git
      url: https://github.com/skyng22003/respeaker-openclaw-talk
      ref: ${realtime_ref}
    components:
      - respeaker_realtime
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password

# Credentials stay in the local, ignored secrets.yaml. The device credential is
# specific to this satellite; it is not an OpenClaw Gateway credential.
respeaker_realtime:
  bridge_url: !secret realtime_bridge_url
  credential: !secret realtime_bridge_credential
